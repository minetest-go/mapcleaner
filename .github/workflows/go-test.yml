name: go-test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x

    - name: Test
      run: |
        go test ./...
